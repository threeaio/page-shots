<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Long page</title>
<style>
  body { margin: 0; font: 18px/1.5 sans-serif; background: #f4f1ea; color: #1d1d1b; }
  header { height: 100px; background: #223344; color: #f4f1ea; display: flex; align-items: center; padding: 0 24px; }
  main section { min-height: 700px; padding: 40px 24px; box-sizing: border-box; }
  main section:nth-child(even) { background: #e6e1d6; }
  footer { height: 200px; background: #2a2a28; color: #f4f1ea; padding: 24px; box-sizing: border-box; }
</style>
</head>
<body>
  <header><strong>Acme</strong>&nbsp;<nav>Home · About · Contact</nav></header>
  <main>
    <section id="intro"><h1>Intro</h1><p>We make things.</p></section>
    <section id="features" class="features"><h2>Features</h2><p>Fast, small, clean.</p></section>
    <section id="pricing" aria-label="Pricing"><p>Three plans, no surprises.</p></section>
    <section class="quotes"><p>No heading here.</p></section>
    <section id="contact"><h2>Contact</h2><p>Write to us.</p></section>
  </main>
  <footer><h2>Acme Inc.</h2><p>Imprint · Privacy</p></footer>
</body>
</html>
