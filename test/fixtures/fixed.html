<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixed bars</title>
<style>
  body { margin: 0; background: #f4f1ea; font: 18px/1.5 sans-serif; }
  .top-nav { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #226644; }
  .app-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 72px; background: #ff00ff; }
  .chat { position: fixed; bottom: 100px; right: 24px; width: 60px; height: 60px; border-radius: 30px; background: #ff00ff; }
  .content { height: 3000px; padding-top: 80px; }
</style>
</head>
<body>
  <div class="top-nav"></div>
  <div class="content"><p>Long content.</p></div>
  <div class="app-bar">Get our app</div>
  <div class="chat"></div>
</body>
</html>
